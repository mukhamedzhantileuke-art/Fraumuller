    <main>
        <section>
            <h2>Ваше мнение важно для нас</h2>
            <form action="#" method="post" id="feedback-form" class="feedback-form">
                <fieldset>
                    <legend>Оставить отзыв</legend>
                    <label for="guestName">Ваше имя:</label>
                    <input type="text" id="guestName" name="guestName" placeholder="Mukha Abdurakhmonov" required>
                    <br><br>
                    
                    <label for="guestEmail">Email:</label>
                    <input type="email" id="guestEmail" name="guestEmail" placeholder="asico@gmail.com" required>
                    <br><br>
                    
                    <label for="rating">Оценка (1-10):</label>
                    <input type="number" id="rating" name="rating" min="1" max="10" required>
                    <br><br>
                    
                    <label for="commentary">Комментарий:</label><br>
                    <textarea id="commentary" name="commentary" rows="5" required></textarea>
                    <br><br>
                    
                    <button type="submit">Отправить отзыв</button>
                    <button type="reset">Сброс</button>
                </fieldset>
            </form>
        </section>
    </main>
